<div id="inpaint-studio" aria-label="인페인트 마스크 편집기">
  <style>
    #inpaint-studio { display:grid; gap:12px; color:var(--foreground,#111); }
    #inpaint-studio .toolbar { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:end; }
    #inpaint-studio .group { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
    #inpaint-studio .form-label { margin:0; }
    #inpaint-studio .size-control { min-width:170px; flex:1; }
    #inpaint-studio .size-line { display:flex; justify-content:space-between; align-items:center; }
    #inpaint-studio .stage { position:relative; min-height:360px; padding:0; overflow:hidden; touch-action:none; display:grid; place-items:center; background:var(--muted,#f3f4f6); }
    #inpaint-studio canvas { display:block; max-width:100%; width:auto; height:auto; cursor:crosshair; }
    #inpaint-studio .empty { position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:28px; color:var(--muted-foreground,#666); pointer-events:none; }
    #inpaint-studio .empty[hidden] { display:none !important; }
    #inpaint-studio .empty strong { display:block; color:var(--foreground,#111); font-weight:500; margin-bottom:4px; }
    #inpaint-studio .status { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; color:var(--muted-foreground,#666); }
    #inpaint-studio .color-dot { inline-size:18px; block-size:18px; border-radius:50%; border:1px solid var(--border,#d4d4d8); display:inline-block; vertical-align:middle; background:var(--mask-color); }
    #inpaint-studio .actions { display:flex; flex-wrap:wrap; gap:6px; margin-left:auto; }
    @media (max-width:520px) { #inpaint-studio .stage { min-height:280px; } #inpaint-studio .actions { margin-left:0; width:100%; } }
  </style>

  <div class="toolbar" aria-label="마스크 도구">
    <label class="form-label">사진
      <input id="ip-file" class="form-control" type="file" accept="image/*">
    </label>
    <div class="group" role="group" aria-label="그리기 도구">
      <button class="btn" type="button" data-tool="rect" aria-pressed="true">사각형</button>
      <button class="btn" type="button" data-tool="ellipse" aria-pressed="false">원형</button>
      <button class="btn" type="button" data-tool="polygon" aria-pressed="false">다각형</button>
      <button class="btn" type="button" data-tool="brush" aria-pressed="false">브러시</button>
      <button class="btn" type="button" data-tool="erase" aria-pressed="false">지우개</button>
      <button class="btn" type="button" data-tool="crop" aria-pressed="false">자르기</button>
    </div>
    <label class="form-label">마스크 색상
      <span class="group">
        <span class="color-dot" aria-hidden="true"></span>
        <input id="ip-color" class="form-control form-control-color" type="color" value="#ef4444">
      </span>
    </label>
    <label class="form-label size-control">
      <span class="size-line"><span>크기</span><output id="ip-size-out">28px</output></span>
      <input id="ip-size" class="form-range" type="range" min="4" max="120" value="28">
    </label>
  </div>

  <div class="toolbar">
    <div class="group">
      <button id="ip-undo" class="btn" type="button" disabled>실행 취소</button>
      <button id="ip-clear" class="btn" type="button" disabled>마스크 지우기</button>
      <button id="ip-close" class="btn" type="button">다각형 닫기</button>
    </div>
    <div class="actions">
      <button id="ip-mask" class="btn" type="button" disabled>마스크 PNG</button>
      <button id="ip-preview" class="btn" type="button" disabled>표시 이미지</button>
      <button id="ip-send" class="btn btn-primary" type="button" disabled>코덱스로 보내기</button>
    </div>
  </div>

  <div id="ip-stage" class="stage card">
    <canvas id="ip-canvas" role="img" aria-label="사진 위에 선택 영역을 그리는 캔버스"></canvas>
    <div id="ip-empty" class="empty"><div><strong>여기에 사진을 놓으세요</strong><span>파일 선택 · 드래그 앤 드롭 · 붙여넣기 지원</span></div></div>
  </div>
  <div class="status text-small"><span id="ip-status">이미지 없음 · v2 2026-10-06</span><span>색칠된 부분이 수정 대상입니다</span></div>

  <script>
  (() => {
    const root = document.getElementById('inpaint-studio');
    const canvas = root.querySelector('#ip-canvas');
    const ctx = canvas.getContext('2d');
    const fileInput = root.querySelector('#ip-file');
    const colorInput = root.querySelector('#ip-color');
    const sizeInput = root.querySelector('#ip-size');
    const sizeOut = root.querySelector('#ip-size-out');
    const empty = root.querySelector('#ip-empty');
    const status = root.querySelector('#ip-status');
    const undoBtn = root.querySelector('#ip-undo');
    const clearBtn = root.querySelector('#ip-clear');
    const maskBtn = root.querySelector('#ip-mask');
    const previewBtn = root.querySelector('#ip-preview');
    const sendBtn = root.querySelector('#ip-send');
    const image = new Image();
    const mask = document.createElement('canvas');
    const mctx = mask.getContext('2d');
    let loaded = false, drawing = false, tool = 'rect', start = null, last = null, polygon = [], history = [], fileName = 'image', lastDown = {t:-1e9,x:0,y:0};

    const point = e => { const r=canvas.getBoundingClientRect(); return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}; };
    const color = (alpha=.55) => { const h=colorInput.value; const n=parseInt(h.slice(1),16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${alpha})`; };
    function redraw(preview) {
      if (!loaded) return;
      ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(image,0,0,canvas.width,canvas.height); ctx.drawImage(mask,0,0);
      if (!preview || !start) return;
      ctx.save(); ctx.fillStyle=color(); ctx.strokeStyle=color(.9); ctx.lineWidth=Math.max(2,canvas.width/500);
      if (tool==='rect') ctx.fillRect(start.x,start.y,preview.x-start.x,preview.y-start.y);
      if (tool==='ellipse') { ctx.beginPath(); ctx.ellipse((start.x+preview.x)/2,(start.y+preview.y)/2,Math.abs(preview.x-start.x)/2,Math.abs(preview.y-start.y)/2,0,0,Math.PI*2); ctx.fill(); }
      if (tool==='polygon' && polygon.length) { ctx.beginPath(); ctx.moveTo(polygon[0].x,polygon[0].y); polygon.slice(1).forEach(p=>ctx.lineTo(p.x,p.y)); ctx.lineTo(preview.x,preview.y); ctx.stroke(); }
      if (tool==='crop') { const x=Math.min(start.x,preview.x), y=Math.min(start.y,preview.y), w=Math.abs(preview.x-start.x), h=Math.abs(preview.y-start.y); ctx.fillStyle='rgba(0,0,0,.18)'; ctx.fillRect(x,y,w,h); ctx.strokeStyle='#fff'; ctx.setLineDash([12,8]); ctx.lineWidth=Math.max(3,canvas.width/420); ctx.strokeRect(x,y,w,h); }
      ctx.restore();
    }
    function snapshot() { history.push(mctx.getImageData(0,0,mask.width,mask.height)); if(history.length>30) history.shift(); update(); }
    function update() { undoBtn.disabled=!history.length; clearBtn.disabled=mask.width===0; [maskBtn,previewBtn,sendBtn].forEach(b=>b.disabled=!loaded); }
    function paintLine(a,b,erase=false) { mctx.save(); mctx.globalCompositeOperation=erase?'destination-out':'source-over'; mctx.strokeStyle=erase?'rgba(0,0,0,1)':color(); mctx.lineWidth=+sizeInput.value; mctx.lineCap='round'; mctx.lineJoin='round'; mctx.beginPath(); mctx.moveTo(a.x,a.y); mctx.lineTo(b.x,b.y); mctx.stroke(); mctx.restore(); }
    function loadFile(file) { if(!file || !file.type.startsWith('image/')) return; const url=URL.createObjectURL(file); image.onload=()=>{ const max=1800, scale=Math.min(1,max/Math.max(image.naturalWidth,image.naturalHeight)); canvas.width=mask.width=Math.round(image.naturalWidth*scale); canvas.height=mask.height=Math.round(image.naturalHeight*scale); mctx.clearRect(0,0,mask.width,mask.height); history=[]; loaded=true; fileName=(file.name||'image').replace(/\.[^.]+$/,''); empty.hidden=true; status.textContent=`${file.name||'붙여넣은 이미지'} · ${image.naturalWidth}×${image.naturalHeight}`; redraw(); update(); URL.revokeObjectURL(url); }; image.src=url; }
    function download(c,suffix) { const a=document.createElement('a'); a.download=`${fileName}-${suffix}.png`; a.href=c.toDataURL('image/png'); a.click(); }
    function markedCanvas() { const out=document.createElement('canvas'); out.width=canvas.width; out.height=canvas.height; out.getContext('2d').drawImage(canvas,0,0); return out; }
    function canvasBlob(c) { return new Promise((resolve,reject)=>c.toBlob(blob=>blob?resolve(blob):reject(new Error('이미지 변환 실패')),'image/png')); }
    async function copyCanvas(c) {
      if (!navigator.clipboard?.write || typeof ClipboardItem==='undefined') throw new Error('이 창에서는 이미지 복사를 지원하지 않습니다.');
      const blob=await canvasBlob(c);
      await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
    }
    function exportMask() { const out=document.createElement('canvas'); out.width=mask.width; out.height=mask.height; const o=out.getContext('2d'); o.fillStyle='#000'; o.fillRect(0,0,out.width,out.height); o.globalCompositeOperation='source-over'; const data=mctx.getImageData(0,0,mask.width,mask.height), d=data.data; for(let i=0;i<d.length;i+=4){ d[i]=d[i+1]=d[i+2]=d[i+3]>0?255:0; d[i+3]=255; } o.putImageData(data,0,0); return out; }
    function finishPolygon() { if(polygon.length<3)return; mctx.save();mctx.fillStyle=color();mctx.beginPath();mctx.moveTo(polygon[0].x,polygon[0].y);polygon.slice(1).forEach(q=>mctx.lineTo(q.x,q.y));mctx.closePath();mctx.fill();mctx.restore();polygon=[];start=null;redraw();update();status.textContent='다각형 선택이 닫혔습니다.'; }
    function cancelCurrentSelection() { if(polygon.length&&history.length)history.pop(); polygon=[]; lastDown.t=-1e9;start=null;drawing=false;redraw();update();status.textContent=loaded?'현재 선택이 취소되었습니다.':'이미지 없음'; }
    function applyCrop(a,b) { const x=Math.max(0,Math.min(a.x,b.x)), y=Math.max(0,Math.min(a.y,b.y)), w=Math.min(canvas.width-x,Math.abs(b.x-a.x)), h=Math.min(canvas.height-y,Math.abs(b.y-a.y)); if(w<12||h<12){cancelCurrentSelection();status.textContent='자를 영역을 조금 더 크게 드래그해 주세요.';return;} const out=document.createElement('canvas');out.width=Math.round(w);out.height=Math.round(h);const sx=x*image.naturalWidth/canvas.width,sy=y*image.naturalHeight/canvas.height,sw=w*image.naturalWidth/canvas.width,sh=h*image.naturalHeight/canvas.height;out.getContext('2d').drawImage(image,sx,sy,sw,sh,0,0,out.width,out.height);image.onload=()=>{canvas.width=mask.width=out.width;canvas.height=mask.height=out.height;mctx.clearRect(0,0,mask.width,mask.height);history=[];loaded=true;drawing=false;start=null;polygon=[];empty.hidden=true;status.textContent=`잘라낸 이미지 · ${out.width}×${out.height} · 기존 마스크 초기화`;redraw();update();};image.src=out.toDataURL('image/png'); }

    root.querySelectorAll('[data-tool]').forEach(btn=>btn.addEventListener('click',()=>{ if(polygon.length&&history.length)history.pop(); tool=btn.dataset.tool; polygon=[]; lastDown.t=-1e9; start=null; drawing=false; root.querySelectorAll('[data-tool]').forEach(b=>b.setAttribute('aria-pressed',String(b===btn))); redraw(); status.textContent=tool==='crop'?'자를 영역을 드래그하세요. 놓으면 바로 적용됩니다.':status.textContent; }));
    fileInput.addEventListener('change',()=>loadFile(fileInput.files[0]));
    colorInput.addEventListener('input',()=>{ root.style.setProperty('--mask-color',colorInput.value); }); root.style.setProperty('--mask-color',colorInput.value);
    sizeInput.addEventListener('input',()=>sizeOut.value=`${sizeInput.value}px`);
    canvas.addEventListener('pointerdown',e=>{ if(!loaded)return; canvas.setPointerCapture(e.pointerId); const p=point(e); if(tool==='polygon'){ const now=e.timeStamp; if(now-lastDown.t<500&&Math.hypot(e.clientX-lastDown.x,e.clientY-lastDown.y)<6){lastDown.t=now;return;} lastDown={t:now,x:e.clientX,y:e.clientY}; if(!polygon.length){snapshot(); polygon=[p]; start=p;} else if(Math.hypot(p.x-polygon[0].x,p.y-polygon[0].y)<Math.max(tol(),12,+sizeInput.value)){ finishPolygon(); } else polygon.push(p); return; } if(tool!=='crop')snapshot(); drawing=true; start=last=p; if(tool==='brush'||tool==='erase') paintLine(p,p,tool==='erase'); });
    canvas.addEventListener('pointermove',e=>{ if(!loaded)return; const p=point(e); if(tool==='polygon'){ if(polygon.length) redraw(p); return; } if(!drawing)return; if(tool==='brush'||tool==='erase'){ paintLine(last,p,tool==='erase');last=p;redraw(); } else redraw(p); });
    function end(e){ if(!drawing)return; const p=point(e); if(tool==='rect'){mctx.fillStyle=color();mctx.fillRect(start.x,start.y,p.x-start.x,p.y-start.y);} if(tool==='ellipse'){mctx.fillStyle=color();mctx.beginPath();mctx.ellipse((start.x+p.x)/2,(start.y+p.y)/2,Math.abs(p.x-start.x)/2,Math.abs(p.y-start.y)/2,0,0,Math.PI*2);mctx.fill();} if(tool==='crop'){const a=start;drawing=false;start=null;applyCrop(a,p);return;} drawing=false;start=null;redraw(); }
    canvas.addEventListener('pointerup',end); canvas.addEventListener('pointercancel',()=>{drawing=false;start=null;redraw();});
    canvas.addEventListener('dblclick',e=>{ if(tool==='polygon'&&polygon.length>=3){e.preventDefault();finishPolygon();} });
    undoBtn.addEventListener('click',()=>{ const s=history.pop(); if(s){mctx.putImageData(s,0,0);polygon=[];start=null;redraw();update();} });
    clearBtn.addEventListener('click',()=>{ if(!loaded)return; lastDown.t=-1e9; snapshot();mctx.clearRect(0,0,mask.width,mask.height);redraw(); });
    maskBtn.addEventListener('click',()=>download(exportMask(),'mask'));
    previewBtn.addEventListener('click',()=>download(markedCanvas(),'marked'));
    sendBtn.addEventListener('click',async()=>{
      const originalLabel=sendBtn.textContent;
      try {
        await copyCanvas(markedCanvas());
        sendBtn.textContent='복사 완료 · 입력창에서 ⌘V';
        status.textContent='표시 이미지가 복사되었습니다. Codex 입력창을 누르고 ⌘V로 붙여넣으세요.';
      } catch (error) {
        sendBtn.textContent='복사 권한을 확인해 주세요';
        status.textContent=`복사하지 못했습니다. 브라우저의 클립보드 권한을 허용한 뒤 다시 눌러주세요. (${error.message})`;
      }
      window.setTimeout(()=>{ sendBtn.textContent=originalLabel; },3200);
    });
    const stage=root.querySelector('#ip-stage'); ['dragenter','dragover'].forEach(n=>stage.addEventListener(n,e=>{e.preventDefault();})); stage.addEventListener('drop',e=>{e.preventDefault();loadFile(e.dataTransfer.files[0]);});
    document.addEventListener('paste',e=>{ const f=[...e.clipboardData.items].find(i=>i.type.startsWith('image/'))?.getAsFile(); if(f)loadFile(f); });
    document.addEventListener('keydown',e=>{ const t=e.target; if(e.isComposing||(t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))))return; if(e.key==='Escape'){e.preventDefault();cancelCurrentSelection();} if(e.key==='Enter'&&tool==='polygon'&&polygon.length>=3){e.preventDefault();finishPolygon();} });
    const tol=()=>{const r=canvas.getBoundingClientRect();return 16*canvas.width/r.width;};   // 화면 16px 를 캔버스 px 로
    root.querySelector('#ip-close').addEventListener('click',()=>{if(polygon.length<3){status.textContent='점을 셋 이상 찍은 뒤 닫습니다.';return;}finishPolygon();});
    update();
  })();
  </script>
</div>
